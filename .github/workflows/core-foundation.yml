name: Core foundation

on:
  push:
    branches:
      - main
      - agent/core-step-tracking-foundation
  pull_request:
    paths:
      - 'PhotogrammetryAI/app/src/main/java/cl/ingenieria/photogrammetryai/core/foundation/**'
      - 'PhotogrammetryAI/app/src/main/java/cl/ingenieria/photogrammetryai/core/fewview/**'
      - 'PhotogrammetryAI/app/src/main/java/cl/ingenieria/photogrammetryai/core/pulleyknowledge/**'
      - 'PhotogrammetryAI/app/src/main/java/cl/ingenieria/photogrammetryai/core/materialhistory/**'
      - 'tools/CoreFoundationV16Test.java'
      - 'tools/StepImportMapperV17Test.java'
      - 'tools/FewViewReconstructionV18Test.java'
      - 'tools/PulleyKnowledgeV21Test.java'
      - 'tools/MaterialHistoryV22Test.java'
      - 'tools/run_core_foundation_v16_test.sh'
      - 'tools/run_step_import_v17_test.sh'
      - 'tools/run_few_view_v18_test.sh'
      - 'tools/run_pulley_knowledge_v21_test.sh'
      - 'tools/run_material_history_v22_test.sh'
      - '.github/workflows/core-foundation.yml'

permissions:
  contents: read

jobs:
  pure-java-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run pure Java core tests
        shell: bash
        run: |
          set +e
          mkdir -p .ci-logs

          bash tools/run_core_foundation_v16_test.sh > .ci-logs/core-v16.log 2>&1
          CORE_EXIT=$?

          bash tools/run_step_import_v17_test.sh > .ci-logs/step-v17.log 2>&1
          STEP_EXIT=$?

          bash tools/run_few_view_v18_test.sh > .ci-logs/few-view-v18.log 2>&1
          FEW_VIEW_EXIT=$?

          bash tools/run_pulley_knowledge_v21_test.sh > .ci-logs/pulley-knowledge-v21.log 2>&1
          PULLEY_KB_EXIT=$?

          bash tools/run_material_history_v22_test.sh > .ci-logs/material-history-v22.log 2>&1
          MATERIAL_HISTORY_EXIT=$?

          echo '===== core-v16.log ====='
          cat .ci-logs/core-v16.log
          echo '===== step-v17.log ====='
          cat .ci-logs/step-v17.log
          echo '===== few-view-v18.log ====='
          cat .ci-logs/few-view-v18.log
          echo '===== pulley-knowledge-v21.log ====='
          cat .ci-logs/pulley-knowledge-v21.log
          echo '===== material-history-v22.log ====='
          cat .ci-logs/material-history-v22.log

          if [ "$CORE_EXIT" -ne 0 ] \
              || [ "$STEP_EXIT" -ne 0 ] \
              || [ "$FEW_VIEW_EXIT" -ne 0 ] \
              || [ "$PULLEY_KB_EXIT" -ne 0 ] \
              || [ "$MATERIAL_HISTORY_EXIT" -ne 0 ]; then
            echo "Core test exits: v16=$CORE_EXIT v17=$STEP_EXIT v18=$FEW_VIEW_EXIT v21=$PULLEY_KB_EXIT v22=$MATERIAL_HISTORY_EXIT"
            exit 1
          fi

      - name: Upload core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-foundation-diagnostics
          path: .ci-logs
          if-no-files-found: warn
          retention-days: 7
