name: Build SKM Polea AI product APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/core-step-tracking-foundation
      - product/single-device-photogrammetry-v1
    paths:
      - 'PulleyKnowledgeMvp/**'
      - '.github/workflows/build-pulley-mvp-apk.yml'
  pull_request:
    paths:
      - 'PulleyKnowledgeMvp/**'
      - '.github/workflows/build-pulley-mvp-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test capture core
        run: bash PulleyKnowledgeMvp/tools/run_capture_core_v26_tests.sh
      - name: Test scale and baseline core
        run: bash PulleyKnowledgeMvp/tools/run_reconstruction_core_v27_tests.sh
      - name: Test industrial landscape capture
        run: bash PulleyKnowledgeMvp/tools/run_industrial_capture_v28_tests.sh
      - name: Test visual correspondences
        run: bash PulleyKnowledgeMvp/tools/run_visual_correspondence_v29_test.sh
      - name: Test multiview graph
        run: bash PulleyKnowledgeMvp/tools/run_view_graph_v30_test.sh
      - name: Test affine RANSAC
        run: bash PulleyKnowledgeMvp/tools/run_affine_ransac_v31_test.sh
      - name: Test fundamental matrix
        run: bash PulleyKnowledgeMvp/tools/run_fundamental_matrix_v32_test.sh
      - name: Test calibrated essential pose
        run: bash PulleyKnowledgeMvp/tools/run_essential_pose_v33_test.sh
      - name: Test sparse triangulation
        run: bash PulleyKnowledgeMvp/tools/run_sparse_triangulation_v34_test.sh
      - name: Test global tracks poses cloud and cylinder
        run: bash PulleyKnowledgeMvp/tools/run_global_reconstruction_v34_v36_test.sh
      - name: Test shell segmentation and metric scale
        run: bash PulleyKnowledgeMvp/tools/run_pulley_shell_segmentation_v37_test.sh
      - name: Test bounded selection refinement and budget
        run: sh PulleyKnowledgeMvp/tools/run_maturity_v39.sh
      - name: Test guided orbit baseline prior
        run: sh PulleyKnowledgeMvp/tools/run_orbit_baseline_v40_test.sh
      - name: Test CAD STEP validation and rigid assembly alignment
        run: sh PulleyKnowledgeMvp/tools/run_cad_assembly_v40_test.sh
      - name: Test mechanical assembly constraints
        run: sh PulleyKnowledgeMvp/tools/run_assembly_constraints_v41_test.sh
      - name: Test STEP rigid centering and axial orientation
        run: sh PulleyKnowledgeMvp/tools/run_step_mesh_placement_v42_test.sh
      - name: Fetch public STEP-enabled cadcore AAR
        run: |
          mkdir -p PulleyKnowledgeMvp/app/libs artifacts
          URL="https://github.com/MedinaParra/FreeCAD-Native/releases/download/cadcore-step-v1/freecad-android-cadcore-step-v1.aar"
          if curl --fail --location --retry 3 --retry-delay 3 "$URL" \
              --output PulleyKnowledgeMvp/app/libs/freecad-android-cadcore-step-v1.aar; then
            echo "CADCORE_MODE=STEP_ENABLED" >> "$GITHUB_ENV"
            sha256sum PulleyKnowledgeMvp/app/libs/freecad-android-cadcore-step-v1.aar \
              | tee artifacts/CADCORE_SHA256.txt
          else
            rm -f PulleyKnowledgeMvp/app/libs/freecad-android-cadcore-step-v1.aar
            echo "CADCORE_MODE=PARAMETRIC_PREVIEW" >> "$GITHUB_ENV"
            echo "Public cadcore release is not available yet" | tee artifacts/CADCORE_SHA256.txt
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p PulleyKnowledgeMvp :app:assembleDebug --stacktrace
      - name: Verify CAD runtime packaging
        run: |
          APK=PulleyKnowledgeMvp/app/build/outputs/apk/debug/app-debug.apk
          echo "$CADCORE_MODE" | tee artifacts/CADCORE_MODE.txt
          if [ "$CADCORE_MODE" = "STEP_ENABLED" ]; then
            unzip -l "$APK" | grep 'lib/arm64-v8a/libfreecad_android_bridge.so'
            unzip -l "$APK" | grep 'lib/arm64-v8a/libTKDESTEP.so'
            unzip -l "$APK" | grep 'lib/arm64-v8a/libTKMesh.so'
            unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
            unzip -l "$APK" | grep 'assets/occt/XSTEPResource/'
          else
            echo "APK built in parametric preview mode; STEP files remain auditable and pending."
          fi
      - name: Prepare artifact
        run: |
          cp PulleyKnowledgeMvp/app/build/outputs/apk/debug/app-debug.apk artifacts/SKM-Polea-AI-CAD-STEP-v0.15.0-alpha16.apk
          sha256sum artifacts/SKM-Polea-AI-CAD-STEP-v0.15.0-alpha16.apk | tee artifacts/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKM-Polea-AI-CAD-STEP-v0.15.0-alpha16
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
