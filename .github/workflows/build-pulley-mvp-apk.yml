name: Build SKM Polea AI MVP APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/core-step-tracking-foundation
    paths:
      - 'PulleyKnowledgeMvp/**'
      - '.github/workflows/build-pulley-mvp-apk.yml'
  pull_request:
    paths:
      - 'PulleyKnowledgeMvp/**'
      - '.github/workflows/build-pulley-mvp-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p PulleyKnowledgeMvp :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp PulleyKnowledgeMvp/app/build/outputs/apk/debug/app-debug.apk artifacts/SKM-Polea-AI-MVP.apk
          sha256sum artifacts/SKM-Polea-AI-MVP.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKM-Polea-AI-MVP
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
