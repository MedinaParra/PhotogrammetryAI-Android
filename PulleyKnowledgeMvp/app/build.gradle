plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.skm.pulleyai'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.skm.pulleyai.lab'
        minSdk 24
        targetSdk 35
        versionCode 46
        versionName '0.18.0-alpha46'
    }

    signingConfigs {
        alphaLab {
            def keyPath = System.getenv('SKM_ALPHA_KEYSTORE_PATH')
            if (keyPath != null && !keyPath.trim().isEmpty()) {
                storeFile file(keyPath)
                storePassword System.getenv('SKM_ALPHA_KEYSTORE_PASSWORD') ?: 'skm-alpha-test'
                keyAlias System.getenv('SKM_ALPHA_KEY_ALIAS') ?: 'skm-alpha-lab'
                keyPassword System.getenv('SKM_ALPHA_KEY_PASSWORD') ?: 'skm-alpha-test'
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('SKM_ALPHA_KEYSTORE_PATH')) {
                signingConfig signingConfigs.alphaLab
            }
            // Preserve both schemes so CI and Android can verify the same stable Lab certificate.
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Alpha46 Lab installs beside earlier alphas and reprocesses exported capture ZIPs with pair-level diagnostics.
dependencies {
    def cadcoreAar = file('libs/freecad-android-cadcore-step-v2.aar')
    if (!cadcoreAar.exists()) {
        throw new GradleException('Pruned STEP-enabled cadcore v2 AAR is required for alpha46 Lab')
    }
    implementation files(cadcoreAar)
}
