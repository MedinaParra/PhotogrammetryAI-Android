plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.skm.pulleyai'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.skm.pulleyai'
        minSdk 24
        targetSdk 35
        versionCode 29
        versionName '0.18.0-alpha29'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def cadcoreAar = file('libs/freecad-android-cadcore-step-v2.aar')
    if (!cadcoreAar.exists()) {
        throw new GradleException('Pruned STEP-enabled cadcore v2 AAR is required for alpha29')
    }
    implementation files(cadcoreAar)
}
