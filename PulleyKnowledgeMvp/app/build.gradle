plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.skm.pulleyai'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.skm.pulleyai'
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName '0.16.0-alpha17'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def cadcoreAar = file('libs/freecad-android-cadcore-step-v1.aar')
    if (!cadcoreAar.exists()) {
        throw new GradleException('STEP-enabled cadcore AAR is required for alpha17')
    }
    implementation files(cadcoreAar)
}
