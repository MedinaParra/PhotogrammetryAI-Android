plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.skm.pulleyai'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.skm.pulleyai'
        minSdk 24
        targetSdk 35
        versionCode 16
        versionName '0.15.0-alpha16'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def cadcoreAar = file('libs/freecad-android-cadcore-step-v1.aar')
    if (cadcoreAar.exists()) {
        implementation files(cadcoreAar)
    }
}
