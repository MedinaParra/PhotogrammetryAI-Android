plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.skm.pulleyai'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.skm.pulleyai'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '0.13.0-alpha14'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
