plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.skm.pulleyai'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.skm.pulleyai.lab2'
        minSdk 24
        targetSdk 35
        versionCode 60
        versionName '0.18.0-alpha60'
    }

    signingConfigs {
        alphaLab {
            def keyPath = System.getenv('SKM_ALPHA_KEYSTORE_PATH')
            if (keyPath != null && !keyPath.trim().isEmpty()) {
                storeFile file(keyPath)
                storePassword System.getenv('SKM_ALPHA_KEYSTORE_PASSWORD') ?: 'skm-alpha-test'
                keyAlias System.getenv('SKM_ALPHA_KEY_ALIAS') ?: 'skm-alpha-lab'
                keyPassword System.getenv('SKM_ALPHA_KEY_PASSWORD') ?: 'skm-alpha-test'
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('SKM_ALPHA_KEYSTORE_PATH')) {
                signingConfig signingConfigs.alphaLab
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Alpha60 keeps STEP/OCCT unchanged and obtains LiteRT from Google Play services,
// avoiding additional native libraries in the APK while the custom model package remains updateable.
dependencies {
    def cadcoreAar = file('libs/freecad-android-cadcore-step-v2.aar')
    if (!cadcoreAar.exists()) {
        throw new GradleException('Pruned STEP-enabled cadcore v2 AAR is required for alpha60 Lab2')
    }
    implementation files(cadcoreAar)
    implementation 'com.google.android.gms:play-services-tflite-java:16.5.0'
}
