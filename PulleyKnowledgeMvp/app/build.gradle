plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.skm.pulleyai'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.skm.pulleyai'
        minSdk 24
        targetSdk 35
        versionCode 45
        versionName '0.18.0-alpha45'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Alpha45 exposes session ZIP export from the scrollable launcher when the capture panel is clipped.
dependencies {
    def cadcoreAar = file('libs/freecad-android-cadcore-step-v2.aar')
    if (!cadcoreAar.exists()) {
        throw new GradleException('Pruned STEP-enabled cadcore v2 AAR is required for alpha45')
    }
    implementation files(cadcoreAar)
}
