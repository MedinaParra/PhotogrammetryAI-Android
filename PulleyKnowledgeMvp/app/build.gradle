plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.skm.pulleyai'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.skm.pulleyai'
        minSdk 24
        targetSdk 35
        versionCode 44
        versionName '0.18.0-alpha44'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Alpha44 adds persistent visual target lock, scene ambiguity rejection and graph bridge remediation.
dependencies {
    def cadcoreAar = file('libs/freecad-android-cadcore-step-v2.aar')
    if (!cadcoreAar.exists()) {
        throw new GradleException('Pruned STEP-enabled cadcore v2 AAR is required for alpha44')
    }
    implementation files(cadcoreAar)
}
